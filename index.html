<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111111'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='%23F5F5F2' font-family='sans-serif' font-weight='700'>D.</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Daven — 2D Game Developer & Creative Developer. I build playful digital experiences with Unity, React and UI/UX design." />
    <meta name="theme-color" content="#F5F5F2" id="theme-color-meta" />
    <!-- Critical: resolve theme BEFORE first paint — same key the React
         theme hook uses (daven-theme), so html/React/CSS/loader share one
         source of truth. No white flash, no theme flash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('daven-theme') || 'light';
          if (t !== 'light' && t !== 'dark') t = 'light';
          var d = document.documentElement;
          d.setAttribute('data-theme', t);
          d.style.colorScheme = t;
          d.style.backgroundColor = t === 'dark' ? '#0d0d0d' : '#f5f5f2';
          var m = document.getElementById('theme-color-meta');
          if (m) m.setAttribute('content', t === 'dark' ? '#0d0d0d' : '#f5f5f2');
        } catch (e) { /* private mode — fall back to light */ }
      })();
    </script>
    <title>Daven. — 2D Game Developer & Creative Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
